[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["full"] }
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
zip = "9.1.0"
regex = "1.13.1"
once_cell = "1.21.4"
url = "2.5.8"
dirs = "7.0.0"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
futures-util = "0.3.34"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"
