# Checks and tests on every push and pull request, then builds the Windows installer.
# Windows only for now: the Rust core is Windows-specific (DPAPI, .exe tools, taskkill),
# and its tests drive fake tools written as .cmd scripts.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Type check (svelte-check + tsc)
        run: npm run check

      - name: UI tests
        run: npx vitest run

      # `generate_context!` embeds ../dist, so the frontend must be built before Rust compiles.
      - name: Build frontend
        run: npm run build

      # Network tests are #[ignore]d and never run here.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # The installer of every green commit, kept as a run artifact (no GitHub Release; see release.yml).
  build:
    name: Build installer (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      # Runs `npm run build` (beforeBuildCommand) itself.
      - name: Build installer
        run: npm run tauri build

      # The bare app exe runs without installing (it needs the WebView2 runtime, which Windows 11 has).
      - name: Name the portable exe
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force src-tauri/target/release/portable | Out-Null
          Copy-Item src-tauri/target/release/Lumi.exe "src-tauri/target/release/portable/Lumi_${version}_x64-portable.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: lumi-windows-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: lumi-windows-portable-${{ github.sha }}
          path: src-tauri/target/release/portable/*.exe
          if-no-files-found: error
          retention-days: 14
